<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des employés</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Liste des employés</h2>
        <a th:href="@{/logout}" class="btn btn-secondary mb-3">Déconnexion</a>
        <form th:action="@{/employees}" method="get" class="mb-3">
            <div class="input-group">
                <input type="text" name="search" th:value="${search}" placeholder="Rechercher un employé" class="form-control">
                <div class="input-group-append">
                    <button type="submit" class="btn btn-primary">Rechercher</button>
                </div>
            </div>
        </form>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Département</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="employee : ${employees}">
                    <td th:text="${employee.employeeName}"></td>
                    <td th:text="${employee.firstName}"></td>
                    <td th:text="${employee.department}"></td>
                    <td><a th:href="@{/employee/{id}(id=${employee.name})}" class="btn btn-info btn-sm">Détails</a></td>
                </tr>
            </tbody>
        </table>
        <form th:action="@{/employees/import}" method="post" enctype="multipart/form-data" class="mt-3">
            <div class="form-group">
                <input type="file" name="file" accept=".csv" class="form-control-file">
            </div>
            <button type="submit" class="btn btn-success">Importer CSV</button>
        </form>
        <div th:if="${message}" class="alert alert-success mt-3" th:text="${message}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger mt-3" th:text="${errorMessage}"></div>
    </div>
</body>
</html>
